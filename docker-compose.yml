# docker compose up --build   ->   UI on http://localhost:5173, API on http://localhost:8000
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes:
      - netpulse-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
volumes:
  netpulse-data:
